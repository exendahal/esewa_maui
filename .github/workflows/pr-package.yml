name: Package (PR artifact)

# Builds the NuGet package on every pull request targeting develop and uploads
# it as a workflow artifact — nothing is published to nuget.org. Download the
# artifact from the run's "Summary" page to test the package on a device.
on:
  pull_request:
    branches:
      - develop
  # Allow manual runs too (Actions tab → Run workflow).
  workflow_dispatch:

jobs:
  package:
    # macOS is required: the iOS binding needs the EsewaBridge Swift shim, which
    # is compiled with Xcode by build-shim.sh.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Build iOS Swift shim (EsewaBridge.xcframework)
        run: |
          chmod +x src/Plugin.Esewa/Native/Shim/build-shim.sh
          ./src/Plugin.Esewa/Native/Shim/build-shim.sh

      # Give each PR build a unique prerelease version (base version from the
      # csproj + the run number), so it never collides with a published version
      # or a stale one in your local NuGet cache.
      - name: Compute version
        id: ver
        run: |
          base=$(grep -oE '<Version>[^<]+' src/Plugin.Esewa/Plugin.Esewa.csproj | head -1 | sed 's/<Version>//')
          echo "version=${base}-ci.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack src/Plugin.Esewa/Plugin.Esewa.csproj
          -c Release
          /p:Version=${{ steps.ver.outputs.version }}
          --output ./artifacts

      - name: Verify iOS framework binaries are packed
        run: |
          pkg=$(ls artifacts/*.nupkg | head -1)
          echo "Inspecting $pkg"
          missing=0
          for fw in EsewaSDK EsewaBridge; do
            if unzip -l "$pkg" | grep -qE "$fw\.framework/$fw$"; then
              echo "OK: $fw binary present"
            else
              echo "MISSING: $fw framework binary is not in the package"
              missing=1
            fi
          done
          exit $missing

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: esewa_maui-nupkg-${{ steps.ver.outputs.version }}
          path: artifacts/*.nupkg
          if-no-files-found: error
