name: Create a (Pre)release on NuGet

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta"
      - "[0-9]+.[0-9]+.[0-9]+-beta[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-preview[0-9]+"

jobs:
  release-nuget:
    # Must run on macOS: the iOS binding depends on the EsewaBridge Swift shim
    # (EsewaBridge.xcframework), which can only be compiled with Xcode. Packing
    # on Windows would silently ship a package whose iOS payment API cannot link.
    runs-on: macos-latest

    # Trusted Publishing (OIDC) — no stored API key. `id-token: write` lets the
    # NuGet/login action exchange a GitHub OIDC token for a short-lived key.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install maui

      - name: Verify commit exists in origin/main or origin/develop
        run: |
          git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*
          if ! git branch --remote --contains | grep -qE 'origin/main|origin/develop'; then
            echo "Tagged commit is not contained in origin/main or origin/develop"
            exit 1
          fi

      - name: Get version information from tag
        id: get_version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build iOS Swift shim (EsewaBridge.xcframework)
        run: |
          chmod +x src/Plugin.Esewa/Native/Shim/build-shim.sh
          ./src/Plugin.Esewa/Native/Shim/build-shim.sh

      - name: Pack
        run: >
          dotnet pack src/Plugin.Esewa/Plugin.Esewa.csproj
          -c Release
          /p:Version=${{ steps.get_version.outputs.version }}
          --output .

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived
      # NuGet API key. Requires a matching trusted-publisher policy on nuget.org
      # (account → Trusted Publishing) for this repo + workflow.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "*.nupkg" -s https://api.nuget.org/v3/index.json -k ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
